name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json OK')"

      - name: Check package.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json OK')"

      - name: Validate JS modules parse without errors
        run: |
          for f in wavParser.js mp3Parser.js beatDetector.js main.js; do
            node --check "$f" || exit 1
            echo "$f — syntax OK"
          done

      - name: Check version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION manifest.json=$MANIFEST_VERSION"
            exit 1
          fi
          echo "Versions match: $PKG_VERSION"
