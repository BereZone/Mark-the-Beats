<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Beat Marker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #2b2b2b;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      padding: 12px;
    }

    .panel { display: flex; flex-direction: column; gap: 10px; }

    h2 {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
      padding-bottom: 6px;
      border-bottom: 1px solid #555;
    }

    .field-group { display: flex; flex-direction: column; gap: 4px; }

    label {
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, input[type="number"], input[type="text"] {
      background: #383838;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      padding: 5px 8px;
      width: 100%;
      outline: none;
    }

    select:focus, input:focus { border-color: #4a9ef7; }

    .detect-btn {
      background: #4a9ef7;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      width: 100%;
    }

    .detect-btn:hover { background: #6abaff; }
    .detect-btn:disabled { background: #383838; color: #999; cursor: not-allowed; }

    .secondary-btn {
      background: #4a4a4a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 12px;
      padding: 6px 12px;
      width: 100%;
    }

    .secondary-btn:hover { background: #5a5a5a; }
    .secondary-btn:disabled { background: #383838; color: #999; cursor: not-allowed; }

    .field-row { display: flex; gap: 6px; }
    .field-row input { flex: 1; min-width: 0; }

    .auto-btn {
      background: #4a4a4a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 11px;
      padding: 5px 10px;
      flex-shrink: 0;
    }

    .auto-btn:hover { background: #5a5a5a; }

    #previewCanvas {
      width: 100%;
      height: 64px;
      background: #202020;
      border: 1px solid #555;
      border-radius: 4px;
      display: block;
      cursor: pointer;
    }

    .preview-info {
      color: #999;
      font-size: 11px;
    }

    .preview-toolbar { display: flex; align-items: center; gap: 6px; }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #4a4a4a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      height: 24px;
      padding: 0 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mini-btn:hover { background: #5a5a5a; }
    .mini-btn:disabled { background: #383838; color: #666; cursor: not-allowed; }
    .mini-btn.armed { background: #4a9ef7; border-color: #4a9ef7; color: #fff; }
    .mini-btn.armed:hover { background: #6abaff; }
    .mini-btn.armed-range { background: #3fae6b; border-color: #3fae6b; color: #fff; }
    .mini-btn.armed-range:hover { background: #55c583; }

    /* Compact icon buttons for zoom in/out — smaller than the text mini-buttons. */
    .zoom-step {
      padding: 0;
      width: 22px;
      font-size: 14px;
    }

    /* Premiere-style zoom/scroll bar: a track spanning the full clip duration
       with a draggable thumb representing the visible window. Drag the thumb
       body to pan, either edge handle to resize (zoom). */
    #zoomBar {
      position: relative;
      height: 18px;
      background: #151515;
      border: 1px solid #6d6d6d;
      border-radius: 9px;
      flex: 0 1 150px;
      min-width: 90px;
    }

    #zoomBar.disabled { opacity: 0.4; }

    #zoomThumb {
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 0;
      width: 100%;
      background: #7d7d7d;
      border-radius: 8px;
      cursor: grab;
      box-sizing: border-box;
    }

    #zoomThumb:active { cursor: grabbing; background: #8f8f8f; }

    /* Visible end-caps, brighter than the thumb body, so the resize zones read
       as distinct grab points rather than blending into a featureless bar. */
    .zoom-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      background: #b4b4b4;
      cursor: ew-resize;
    }

    .zoom-handle:hover { background: #cccccc; }

    .zoom-handle-left  { left: 0; border-radius: 8px 0 0 8px; }
    .zoom-handle-right { right: 0; border-radius: 0 8px 8px 0; }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .status-header span { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

    .clear-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
    }

    .clear-btn:hover { color: #e0e0e0; }

    #statusLog {
      background: #383838;
      border: 1px solid #555;
      border-radius: 4px;
      min-height: 120px;
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      font-size: 11px;
      line-height: 1.6;
      font-family: "SF Mono", "Consolas", monospace;
      color: #e0e0e0;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .log-idle    { color: #999; }
    .log-info    { color: #e0e0e0; }
    .log-success { color: #70d080; }
    .log-error   { color: #f07070; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Beat Marker</h2>

    <div class="field-group">
      <label for="manualBpm">BPM (blank = auto-detect)</label>
      <div class="field-row">
        <input type="number" id="manualBpm" min="1" max="999" step="0.1" placeholder="Auto" />
        <button type="button" id="autoBpmBtn" class="auto-btn" title="Clear and use auto-detected BPM">Auto</button>
      </div>
    </div>

    <div class="field-group">
      <label for="nthBeat">Place marker every</label>
      <select id="nthBeat">
        <option value="0.25">Every ¼ beat (16th notes)</option>
        <option value="0.5">Every ½ beat (8th notes)</option>
        <option value="1" selected>Auto (every beat)</option>
        <option value="2">Every 2nd beat (half bar in 4/4)</option>
        <option value="3">Every 3rd beat (bar in 3/4)</option>
        <option value="4">Every 4th beat (bar in 4/4)</option>
        <option value="5">Every 5th beat (bar in 5/4)</option>
        <option value="6">Every 6th beat (bar in 6/8, 2 bars in 3/4)</option>
        <option value="7">Every 7th beat (bar in 7/8)</option>
        <option value="8">Every 8th beat (2 bars in 4/4)</option>
        <option value="9">Every 9th beat (bar in 9/8)</option>
        <option value="12">Every 12th beat (bar in 12/8, 3 bars in 4/4)</option>
        <option value="16">Every 16th beat (4 bars in 4/4)</option>
      </select>
    </div>

    <div class="field-group">
      <label for="offset">Offset (ms)</label>
      <input type="number" id="offset" value="0" step="1" placeholder="0" />
    </div>

    <div class="field-group">
      <label for="prefix">Marker name prefix</label>
      <input type="text" id="prefix" value="Beat" maxlength="32" />
    </div>

    <div class="field-group">
      <label for="markerColor">Marker color</label>
      <select id="markerColor">
        <option value="-1">Default</option>
        <option value="0">Green</option>
        <option value="1">Red</option>
        <option value="2">Purple</option>
        <option value="3">Orange</option>
        <option value="4">Yellow</option>
        <option value="5">White</option>
        <option value="6">Blue</option>
        <option value="7">Cyan</option>
      </select>
    </div>

    <button id="analyzeBtn" class="detect-btn">Analyze Selected Clip</button>

    <div class="field-group">
      <label for="previewCanvas">Preview (click to seek)</label>
      <canvas id="previewCanvas"></canvas>
      <div class="preview-toolbar">
        <button type="button" id="playBtn" class="mini-btn" disabled>▶ Play</button>
        <button type="button" id="zoomOutBtn" class="mini-btn zoom-step" disabled title="Zoom out">&minus;</button>
        <div id="zoomBar" class="disabled" title="Drag to pan, edges to zoom">
          <div id="zoomThumb">
            <div class="zoom-handle zoom-handle-left" id="zoomHandleLeft"></div>
            <div class="zoom-handle zoom-handle-right" id="zoomHandleRight"></div>
          </div>
        </div>
        <button type="button" id="zoomInBtn" class="mini-btn zoom-step" disabled title="Zoom in">&plus;</button>
      </div>
      <div class="preview-toolbar">
        <button type="button" id="anchorBtn" class="mini-btn" disabled title="Then click the downbeat in the waveform to lock the grid's phase to it (Beat 1)">◎ Set Beat 1</button>
        <button type="button" id="anchorClearBtn" class="mini-btn" disabled title="Remove the anchor and revert to the detected phase">Clear anchor</button>
        <span id="anchorInfo" class="preview-info"></span>
      </div>
      <div class="preview-toolbar">
        <button type="button" id="rangeInBtn" class="mini-btn" disabled title="Then click the waveform to set where marker placement starts">⟤ Set In</button>
        <button type="button" id="rangeOutBtn" class="mini-btn" disabled title="Then click the waveform to set where marker placement ends">Set Out ⟥</button>
        <button type="button" id="rangeClearBtn" class="mini-btn" disabled title="Place markers across the whole clip again">Clear range</button>
        <span id="rangeInfo" class="preview-info"></span>
      </div>
      <div id="previewInfo" class="preview-info">No analysis yet — click Analyze.</div>
    </div>

    <button id="placeBtn" class="detect-btn" disabled>Place Markers</button>
    <button id="undoBtn" class="secondary-btn" disabled title="Remove only the markers placed by the last Place Markers run">Undo Placed Markers</button>
    <button id="clearMarkersBtn" class="secondary-btn">Clear Markers on Clip</button>

    <div>
      <div class="status-header">
        <span>Status</span>
        <button id="clearBtn" class="clear-btn" title="Clear log">✕</button>
      </div>
      <div id="statusLog">
        <div class="log-idle">Ready. Select a clip or leave nothing selected to use the full sequence.</div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
